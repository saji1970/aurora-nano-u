const params = new URLSearchParams(location.search);
const MODE = params.get('mode') || 'assembled';   // assembled | exploded | front | anim | worn
const EXPLODED = MODE === 'exploded' || MODE === 'anim';   // build arms as separate shells
const W = +params.get('w') || 2400, H = +params.get('h') || 1500;

const scene = new THREE.Scene();

  const [b0, b1, b2] = BG.length ? [BG[0], BG[1] || BG[0], BG[2] || BG[1] || BG[0]] : ['#ffffff', '#eef0f3', '#d6dae0'];
  const grd = g.createRadialGradient(600, 300, 50, 600, 375, 820); grd.addColorStop(0, b0); grd.addColorStop(0.45, b1); grd.addColorStop(1, b2);
  g.fillStyle = grd; g.fillRect(0, 0, 1200, 750); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const pmrem = new THREE.PMREMGenerator(renderer);
// studio environment: dark room with soft boxes, so gloss and glass pick up long, clean highlights
function studioEnv() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(120, 120, 120), new THREE.MeshBasicMaterial({ color: 0x2a2c30, side: THREE.BackSide })));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshBasicMaterial({ color: 0x8a8c90 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -40; s.add(floor);
  const panel = (w, h, pos, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m); };
  panel(70, 26, [0, 50, 8], 7);        // overhead softbox
  panel(10, 80, [-50, 8, 24], 5);      // left strip
  panel(10, 80, [50, 8, -18], 3.5);    // right strip
  panel(60, 18, [0, 4, 56], 1.6);      // front fill

}
scene.environment = params.get('env') === 'room' ? pmrem.fromScene(new RoomEnvironment(), 0.04).texture : studioEnv();

// ---------- lights ----------
const key = new THREE.DirectionalLight(0xffffff, 2.4);

// ---------- textures ----------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const pcbTex = canvasTex(1536, 384, (g, w, h) => {
  g.fillStyle = '#0d3b2a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 520; i++) {
    g.strokeStyle = rnd() < 0.5 ? 'rgba(60,150,100,0.55)' : 'rgba(40,120,80,0.45)';
    g.lineWidth = 1 + rnd() * 3;
    let x = rnd() * w, y = rnd() * h;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 3; k++) {
      if (rnd() < 0.5) x += (rnd() - 0.5) * 300; else y += (rnd() - 0.5) * 140;
      g.lineTo(x, y);
    }
    g.stroke();
  }
  for (let i = 0; i < 900; i++) {
    g.fillStyle = 'rgba(214,176,92,0.9)';
    g.beginPath(); g.arc(rnd() * w, rnd() * h, 2 + rnd() * 2.5, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(235,240,235,0.85)'; g.font = '22px Helvetica';
  g.fillText('AURORA', 30, h - 26);
  g.fillText('REV A  10L HDI', w - 220, 40);
});
const radioTex = pcbTex.clone(); radioTex.needsUpdate = true;

function chipTex(lines, bg = '#141416') {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(160,165,170,0.85)';
    g.font = 'bold 74px Helvetica'; g.textAlign = 'center';
    lines.forEach((l, i) => g.fillText(l, w / 2, h / 2 - (lines.length - 1) * 45 + i * 92 + 24));
    g.beginPath(); g.arc(50, 50, 14, 0, 7); g.fill();
  });
}
const batteryTex = canvasTex(1024, 256, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#d9dce0'); grd.addColorStop(0.5, '#f4f5f6'); grd.addColorStop(1, '#c9ccd1');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1f5fbf'; g.fillRect(40, 40, w - 80, h - 80);
  g.fillStyle = '#ffffff'; g.font = 'bold 56px Helvetica'; g.fillText('Li-Po  3.85 V', 80, 120);
  g.font = '40px Helvetica'; g.fillText('340 mAh · 1.3 Wh', 80, 180);
});
const lgaTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#2b2b2b'; g.fillRect(0, 0, w, h);
});
const brushedTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2400; i++) {
    const v = 110 + rnd() * 50; g.strokeStyle = `rgba(${v},${v},${v},0.35)`;
    const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (rnd() - 0.5) * 3); g.stroke();
  }
}, false);
const antennaTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#2a2e33'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#d4a650'; g.lineWidth = 26; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(40, 460);
  for (let i = 0; i < 6; i++) { g.lineTo(40 + i * 80, i % 2 ? 460 : 60); g.lineTo(80 + i * 80, i % 2 ? 460 : 60); }
  g.stroke();
});
const speakerTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#1a1b1e'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#050506';
  for (let x = 30; x < w - 20; x += 26) for (let y = 30; y < h - 20; y += 26) { g.beginPath(); g.arc(x, y, 8, 0, 7); g.fill(); }
});

// ---------- materials ----------
const M = {
  // polished acetate: a glossy clear coat over a slightly softer base
  frame: new THREE.MeshPhysicalMaterial({ color: 0x1d1e22, roughness: 0.28, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.04, ior: 1.49, specularIntensity: 1 }),
  frameInner: new THREE.MeshPhysicalMaterial({ color: 0x26272c, roughness: 0.55, metalness: 0.0, clearcoat: 0.3 }),
  touch: new THREE.MeshPhysicalMaterial({ color: 0x2c2e33, roughness: 0.18, metalness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.04 }),
  antennaWin: new THREE.MeshPhysicalMaterial({ color: 0x35373c, roughness: 0.6, metalness: 0.0 }),
  // real glass: refracts what is behind it, with a faint anti-reflection coating sheen
  lens: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.0, metalness: 0, transmission: 1.0, thickness: 1.6, ior: 1.6,
    iridescence: 0.35, iridescenceIOR: 1.38, iridescenceThicknessRange: [220, 480], specularIntensity: 1, envMapIntensity: 1.2 }),
  metal: new THREE.MeshPhysicalMaterial({ color: 0xc9ccd1, roughness: 0.28, metalness: 1.0, roughnessMap: brushedTex }),
  darkMetal: new THREE.MeshPhysicalMaterial({ color: 0x55585e, roughness: 0.35, metalness: 1.0 }),
  gold: new THREE.MeshPhysicalMaterial({ color: 0xe2b24f, roughness: 0.25, metalness: 1.0 }),
  pcb: new THREE.MeshPhysicalMaterial({ map: pcbTex, roughness: 0.45, clearcoat: 0.6, clearcoatRoughness: 0.3 }),
  pcbEdge: new THREE.MeshStandardMaterial({ color: 0x1c4a33, roughness: 0.6 }),
  flex: new THREE.MeshPhysicalMaterial({ color: 0xd18a22, roughness: 0.35, metalness: 0.1, clearcoat: 0.8, transmission: 0.0, side: THREE.DoubleSide }),
  graphite: new THREE.MeshPhysicalMaterial({ color: 0x3a3b3f, roughness: 0.42, metalness: 0.65 }),
  battery: new THREE.MeshPhysicalMaterial({ map: batteryTex, roughness: 0.35, metalness: 0.3, clearcoat: 0.5 }),
  batteryPouch: new THREE.MeshPhysicalMaterial({ color: 0xd8dbe0, roughness: 0.3, metalness: 0.6 }),
  rubber: new THREE.MeshPhysicalMaterial({ color: 0xe8ecef, roughness: 0.4, transmission: 0.6, thickness: 2, transparent: true }),
  glassDark: new THREE.MeshPhysicalMaterial({ color: 0x0b0d1a, roughness: 0.02, metalness: 0.4, clearcoat: 1.0, iridescence: 1.0, iridescenceThicknessRange: [300, 600] }),
  speaker: new THREE.MeshPhysicalMaterial({ map: speakerTex, roughness: 0.6 }),
  antenna: new THREE.MeshPhysicalMaterial({ map: antennaTex, roughness: 0.4, metalness: 0.5 }),
  black: new THREE.MeshPhysicalMaterial({ color: 0x18181b, roughness: 0.5 }),
  ceramic: new THREE.MeshPhysicalMaterial({ color: 0x9a7b55, roughness: 0.5 }),
  led: new THREE.MeshPhysicalMaterial({ color: 0xffffff, emissive: 0xfff4e0, emissiveIntensity: params.has('ledoff') ? 0 : 2.2, roughness: 0.3, transmission: 0.2 }),
};

// ---------- colour variants ----------
const tortoiseTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#7a4318'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 150; i++) {
    const x = rnd() * w, y = rnd() * h, r = 50 + rnd() * 150, dark = rnd() < 0.6;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, dark ? 'rgba(28,12,4,0.85)' : 'rgba(214,140,58,0.7)');
    grd.addColorStop(1, dark ? 'rgba(28,12,4,0)' : 'rgba(214,140,58,0)');
    g.fillStyle = grd; g.beginPath(); g.ellipse(x, y, r * 1.6, r, rnd() * 3, 0, 7); g.fill();
  }
});
tortoiseTex.wrapS = tortoiseTex.wrapT = THREE.RepeatWrapping; tortoiseTex.repeat.set(1 / 120, 1 / 120);
const PALETTES = {
  obsidian: { frame: 0x1d1e22, inner: 0x26272c, rough: 0.32, cc: 0.9 },
  glacier:  { frame: 0xe9e8e3, inner: 0xd6d5d0, rough: 0.42, cc: 0.6, touch: 0xbfc1c4 },
  havana:   { tex: tortoiseTex, inner: 0x3b2314, rough: 0.22, cc: 1.0 },
  midnight: { frame: 0x1b2a4c, inner: 0x16213a, rough: 0.3, cc: 0.9 },
  sage:     { frame: 0x7d907e, inner: 0x6a7b6b, rough: 0.5, cc: 0.4, touch: 0x5d6b5e },
  blush:    { frame: 0xdcaa9c, inner: 0xc9968a, rough: 0.4, cc: 0.7, touch: 0xb48478 },
  // clear acetate front; the arms carry electronics so they stay opaque graphite
  crystal:  { frame: 0xf7f7f5, inner: 0x2c2d31, rough: 0.02, cc: 1.0, clear: 1.0, arm: 0x34363b, touch: 0x2c2e33 },
  smoke:    { frame: 0x5e5a55, inner: 0x2c2d31, rough: 0.06, cc: 1.0, clear: 0.7, arm: 0x2a2b2f },
};
const PAL = PALETTES[COLOR] || PALETTES.obsidian;
if (PAL.tex) { M.frame.map = PAL.tex; M.frame.color.set(0xffffff); } else M.frame.color.set(PAL.frame);
M.frame.roughness = PAL.rough; M.frame.clearcoat = PAL.cc;
M.arm = M.frame;
if (PAL.clear) {
  M.arm = M.frame.clone(); M.arm.color.set(PAL.arm); M.arm.roughness = 0.25;
  Object.assign(M.frame, { transmission: PAL.clear, thickness: 3, attenuationColor: new THREE.Color(PAL.frame), attenuationDistance: 30 });
}
M.frameInner.color.set(PAL.inner); M.antennaWin.color.set(PAL.inner);
if (PAL.touch) M.touch.color.set(PAL.touch);
// lens tints, as the colour of the glass (transmission multiplies by it)
const METALS = { gold: 0xe6c27a, silver: 0xd9dce1, gunmetal: 0x5b5e64 };
M.rim = new THREE.MeshPhysicalMaterial({ color: METALS[params.get('metal')] || METALS.gold, metalness: 1, roughness: 0.16 });
const LENSES = { g15: 0x5a6650, clear: 0xffffff, sun: 0x3a3732, amber: 0xe3a865, blue: 0x6f92c8, rose: 0xe2a6ac };
M.lens.color.set(LENSES[LENS] || LENSES.clear);


// ---------- helpers ----------
const labels = [];  // {obj, local, title, sub}
function addLabel(obj, title, sub, local = new THREE.Vector3(), pref) { if (labelOn) labels.push({ obj, local, title, sub, pref }); }
function shadowy(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; }
function rbox(w, h, d, r, mat) { return shadowy(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2, h / 2, d / 2) * 0.999), mat)); }
function box(w, h, d, mat) { return shadowy(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat)); }
function cyl(r, len, mat, seg = 48) { return shadowy(new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat)); }

// Superellipse lens outline
function lensPts(cx, cy, a, b, n = 3.4, nb = 2.5, N = 120) {
  const pts = [];
  for (let i = 0; i < N; i++) {
    const t = (i / N) * Math.PI * 2;
    const c = Math.cos(t), s = Math.sin(t);
    const e = s < 0 ? nb : n;
    const x = a * Math.sign(c) * Math.pow(Math.abs(c), 2 / e);
    let y = b * Math.sign(s) * Math.pow(Math.abs(s), 2 / e);
    if (STY.warp && cx !== 0) y = WARPS[STY.warp](x * Math.sign(cx), y, a, b);   // u > 0 is towards the temple
    pts.push(new THREE.Vector2(cx + x, cy + y));
  }
  return pts;
}
function lensBottom(x, cx, a, b, nb = 2.5) {
  const u = Math.abs(x - cx) / a;
  if (u >= 1) return Infinity;
  return -b * Math.pow(1 - Math.pow(u, nb), 1 / nb);
}
function chaikin(pts, it = 3) {
  for (let k = 0; k < it; k++) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      out.push(new THREE.Vector2(0.75 * p.x + 0.25 * q.x, 0.75 * p.y + 0.25 * q.y));
      out.push(new THREE.Vector2(0.25 * p.x + 0.75 * q.x, 0.25 * p.y + 0.75 * q.y));
    }
    pts = out;
  }
  return pts;
}

// ---------- dimensions (mm) ----------
// lens centre x, half width, half height and superellipse exponents (top, bottom) per frame style
const STYLES = {
  square: { LX: 34, LA: 25, LB: 19, n: 3.4, nb: 2.5, rim: 4 },
  round:  { LX: 31.5, LA: 21, LB: 20, n: 2.05, nb: 2.05, rim: 3.4 },
  panto:  { LX: 33, LA: 23.5, LB: 19.5, n: 3.0, nb: 1.9, rim: 3.6 },
  rectangular: { LX: 34, LA: 26, LB: 15, n: 7, nb: 7, rim: 3.4 },
  aviator: { LX: 35, LA: 26, LB: 22, n: 3.2, nb: 1.9, rim: 1.8, metal: true, dbl: true, warp: 'aviator' },
  cateye:  { LX: 33.5, LA: 24.5, LB: 18, n: 3.0, nb: 2.1, rim: 4.4, warp: 'cateye' },
  browline: { LX: 33.5, LA: 24, LB: 18.5, n: 3.2, nb: 2.2, rim: 1.6, metal: true, brow: true },
  oversized: { LX: 36, LA: 28.5, LB: 24, n: 2.8, nb: 2.3, rim: 4.4 },
  sport:   { LX: 34, LA: 27, LB: 17, n: 3.2, nb: 2.2, rim: 3.2, warp: 'sport', wrap: 0.16 },
};
// shape tweaks: (u across the lens, + towards the temple; v up) -> new v
const WARPS = {
  aviator: (u, v, a) => v < 0 ? v * (1.2 - 0.34 * u / a) : v * 0.9,                         // teardrop: deeper on the nose side
  cateye: (u, v, a) => v > 0 ? v + 8 * Math.pow(Math.max(0, u / a), 3.5) : v * (1 - 0.22 * Math.max(0, u / a)),  // upswept outer corner
  sport: (u, v, a) => v * (1 - 0.28 * Math.max(0, u / a)) + 2.5 * Math.max(0, u / a),        // swept back towards the temple
};
const STY = STYLES[STYLE] || STYLES.square;
const RINGED = STYLE !== 'square' && !!STYLES[STYLE];
const LX = STY.LX, LA = STY.LA, LB = STY.LB;
const RIM = STY.rim;
const TOP = LB + RIM;                 // 23
const ARM_X = 71.5, ARM_T = 6.5;

// ---------- front frame ----------
function frontShape() {
  const top = [], bot = [];
  const X0 = -75, X1 = 75;
  for (let x = X0; x <= X1 + 1e-6; x += 0.5) {
    let yb = Math.min(lensBottom(x, -LX, LA + RIM, LB + RIM), lensBottom(x, LX, LA + RIM, LB + RIM));
    if (Math.abs(x) < 9) yb = Math.min(yb, 7);       // bridge
    if (Math.abs(x) > 60) yb = Math.min(yb, 4);      // end piece
    if (!isFinite(yb)) yb = 7;
    bot.push(new THREE.Vector2(x, yb));
    // top line with gentle brow curve
    const yt = TOP + 0.6 * Math.cos((x / 75) * Math.PI * 1.0) * 0 + (Math.abs(x) < 9 ? -1.2 * (1 - Math.abs(x) / 9) : 0);
    top.push(new THREE.Vector2(x, yt));
  }
  const pts = chaikin([...bot, ...top.reverse()], 3);
  const shape = new THREE.Shape(pts);
  [-LX, LX].forEach(cx => shape.holes.push(new THREE.Path(lensPts(cx, 0, LA, LB, STY.n, STY.nb).reverse())));
  return shape;
}
function pivotAt(obj, cx, s) {
  // turn a lens or rim about its own centre so the outer edge sweeps back (sport wrap)
  if (!STY.wrap) return obj;
  const p = new THREE.Group(); p.position.x = cx; obj.position.x -= cx; p.add(obj); p.rotation.y = s * STY.wrap; return p;
}
function ringGeo(cx, ao, bo, ai, bi, depth, bev) {
  const shape = new THREE.Shape(lensPts(cx, 0, ao, bo, STY.n, STY.nb, 180));
  shape.holes.push(new THREE.Path(lensPts(cx, 0, ai, bi, STY.n, STY.nb, 180).reverse()));
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bev, bevelSize: bev * 0.9, bevelSegments: 8, curveSegments: 96 });
  geo.translate(0, 0, -depth / 2);
  return geo;
}
function buildRings(g) {
  // each lens gets its own rim, joined by a bridge and tabs out to the hinge blocks
  const rimMat = STY.metal ? M.rim : M.frame;
  [-1, 1].forEach(s => {
    const cx = s * LX;
    const rim = STY.metal ? ringGeo(cx, LA + RIM, LB + RIM, LA, LB, 1.4, 0.55) : ringGeo(cx, LA + RIM, LB + RIM, LA, LB, 3.6, 1.2);
    g.add(pivotAt(shadowy(new THREE.Mesh(rim, rimMat)), cx, s));
    if (STY.brow) {
      // acetate brow over the top of a thin metal rim
      const yc = 2;
      const out = lensPts(cx, 0, LA + 5.2, LB + 5.2, STY.n, STY.nb, 180).filter(p => p.y > yc);
      const inn = lensPts(cx, 0, LA + 0.6, LB + 0.6, STY.n, STY.nb, 180).filter(p => p.y > yc + 3);

function ribbon(points, width, mat) {
  const curve = new THREE.CatmullRomCurve3(points);
  const N = 80, pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const p = curve.getPoint(i / N);
    pos.push(p.x, p.y - width / 2, p.z, p.x, p.y + width / 2, p.z);
    if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  return shadowy(new THREE.Mesh(geo, mat));
}

    addLabel(bg, 'Radio board', '5G modem, RF, Wi-Fi/BT, charger, audio', new THREE.Vector3(-4, -5.8, -out * 0.4));
    addLabel(parts.wifi, 'Wi-Fi 7 / Bluetooth', 'inner side, with charger and audio', new THREE.Vector3(0, 0, -out * 0.4));
  }

  // hinge flex
  const hf = ribbon([
    new THREE.Vector3(s * 68.5, 14, -4), new THREE.Vector3(s * 70, 14, -10), new THREE.Vector3(s * 73.6, 14, -13.5),
    new THREE.Vector3(s * 73.6, 14, -16.5), new THREE.Vector3(s * 71.6, 14, -20.5), new THREE.Vector3(s * 71.4, 14, -26)
  ], 5, M.flex);
  hf.position.set(s * ex(8), ex(26), ex(4));
  armGroup.add(hf);
  if (s > 0) addLabel(hf, 'Hinge flex', 'loops round the hinge pin, folds without creasing', new THREE.Vector3(s * 73.6, 14, -15));

  // antenna
  const ant = buildAntenna(); ant.rotation.y = Math.PI / 2;
  ant.position.set(s * 71.3 + s * ex(8), armCenterY(87) + ex(20), -87);
  armGroup.add(ant);
  if (s < 0) addLabel(ant, 'Antenna', 'LDS trace behind the plastic window', new THREE.Vector3(0, 4, 0));

  // speaker
  const sp = buildSpeaker(); sp.rotation.y = Math.PI / 2;
  if (s > 0) sp.rotation.y = -Math.PI / 2;
  sp.position.set(s * 71.3 + s * ex(6), armCenterY(100) - ex(22), -100);
  armGroup.add(sp);
  if (s < 0) addLabel(sp, 'Open-ear speaker', 'aims down at the ear canal', new THREE.Vector3(0, -3.5, 0));

  // battery
  const bat = buildBattery(); bat.rotation.y = Math.PI / 2;
  if (s < 0) { bat.rotation.y = -Math.PI / 2; }
  bat.userData.label.position.z = 2.82;
  bat.position.set(s * 71.3 + s * ex(18), armCenterY(124), -124);
  armGroup.add(bat);
  if (s < 0) addLabel(bat, 'Battery cell', '46 × 10 × 6 mm, ~1.3 Wh, one per arm', new THREE.Vector3(10, 4, 2.8));
});
return { root, fade, armGroups };
}

// ---------- build ----------
const pivot = new THREE.Group(); pivot.position.z = -80; scene.add(pivot);
const built = buildAll(MODE === 'exploded' ? 1 : 0);
const root = built.root; root.position.z = 80; pivot.add(root);

// ---------- ground / shadow ----------
const groundY = MODE === 'exploded' ? -60 : MODE === 'anim' ? -40 : -17.5;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: MODE === 'exploded' ? 0.0 : 0.22 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = groundY; ground.receiveShadow = true;
scene.add(ground);

// ---------- worn on a mannequin bust ----------
async function loadMesh(url, mat) {
  const buf = await (await fetch(url)).arrayBuffer();
  const [nv, ni] = new Uint32Array(buf, 0, 2);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(buf, 8, nv * 3), 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(buf, 8 + nv * 12, nv * 3), 3));
  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(buf, 8 + nv * 24, ni), 1));
  geo.computeVertexNormals();   // smoother than the SDF gradient normals
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true;
  return m;
}
if (MODE === 'worn') {
  const MODEL = params.get('model') || 'kai';
  const skinCol = '#' + (params.get('skin') || 'c99a7a'), hairCol = '#' + (params.get('hair') || '2a211c');
  const skin = new THREE.MeshPhysicalMaterial({ color: skinCol, roughness: 0.78, sheen: 0.25, sheenRoughness: 0.6, sheenColor: new THREE.Color(skinCol).lerp(new THREE.Color('#ffffff'), 0.3), envMapIntensity: 0.7 });
  const hair = new THREE.MeshPhysicalMaterial({ side: THREE.DoubleSide, color: hairCol, envMapIntensity: 0.7, roughness: 0.8, sheen: 1.0, sheenRoughness: 0.35, sheenColor: new THREE.Color(hairCol).lerp(new THREE.Color('#ffffff'), 0.3) });
  const bust = new THREE.Group();
  bust.add(await loadMesh(`bust-${MODEL}-skin.bin`, skin));
  bust.add(await loadMesh(`bust-${MODEL}-hair.bin`, hair));
  root.add(bust);
  // glasses a touch larger and arms a touch shorter to sit on this head
  root.children.forEach(c => { if (c !== bust) { c.scale.setScalar(1.06); } });
  built.armGroups.forEach(g => g.scale.z = 0.84);
  ground.visible = false;
  key.position.set(-260, 260, 380); key.intensity = 2.0;
  sc.left = -400; sc.right = 400; sc.top = 400; sc.bottom = -400; sc.far = 1400; sc.updateProjectionMatrix();
  rim.intensity = 1.8;
}

// ---------- camera ----------
let camera;
function aim(cam, target, dir, dist) {
  const d = new THREE.Vector3(...dir).normalize().multiplyScalar(dist);
  cam.position.copy(new THREE.Vector3(...target).add(d)); cam.lookAt(...target);
}
if (MODE === 'exploded') {
  camera = new THREE.PerspectiveCamera(24, W / H, 1, 3000);
  camera.position.set(-14 - 526 * 1.1, 12 + 398 * 1.1, -70 + 540 * 1.1);
  camera.lookAt(-14, 12, -70);
  camera.setViewOffset(W, H, -80, -30, W, H);
} else if (params.get('cam') === 'corner') {
  // close-up of the right front corner: RGB camera and privacy LED
  camera = new THREE.PerspectiveCamera(18, W / H, 1, 3000);
  aim(camera, [-50, 10, -4], [-0.42, 0.16, 1], 230);
} else if (params.get('cam') === 'gallery') {
  // a gentle three-quarter that still shows the lens shape
  camera = new THREE.PerspectiveCamera(16, W / H, 1, 3000);
  camera.position.set(-230 * 1.35, 95 * 1.35 + 4, 430 * 1.35 - 54);
  camera.lookAt(0, 0, -40);
} else if (MODE === 'front') {
  camera = new THREE.PerspectiveCamera(15, W / H, 1, 3000);
  camera.position.set(-30, 60, 520);
  camera.lookAt(0, 4, -40);
} else if (MODE === 'worn') {
  camera = new THREE.PerspectiveCamera(+params.get('fov') || 20, W / H, 1, 5000);
  const views = {
    'three-quarter': [[0, -40, -70], [-0.66, 0.12, 0.75], 1050],
    'front': [[0, -45, -60], [0.06, 0.04, 1], 1050],
    'profile': [[0, -40, -80], [-1, 0.06, 0.08], 1050],
    'close': [[-8, 0, -30], [-0.5, 0.14, 0.86], 560],
    'low': [[0, -20, -70], [0.45, -0.12, 0.88], 900],
  };
  aim(camera, ...(views[VIEW] || views['three-quarter']));
  if (params.has('ox')) camera.setViewOffset(W, H, +params.get('ox'), +(params.get('oy') || 0), W, H);
} else if (MODE === 'anim') {
  camera = new THREE.PerspectiveCamera(22, W / H, 1, 5000);
} else {
  camera = new THREE.PerspectiveCamera(22, W / H, 1, 3000);
  camera.position.set(-330, 150, 330);
  camera.lookAt(0, 2, -62);
  camera.setViewOffset(W, H, 0, -20, W, H);
}

// ---------- animation: turntable + explode ----------
if (MODE === 'anim') {
  // build a second, fully exploded copy and record where every part ends up
  const b1 = buildAll(1);
  const A = [], B = [];
  root.traverse(o => A.push(o)); b1.root.traverse(o => B.push(o));
  if (A.length !== B.length) console.log('structure mismatch', A.length, B.length);
  A.forEach((o, i) => { o.userData.p0 = o.position.clone(); o.userData.p1 = B[i].position.clone(); });
  built.fade.forEach(g => g.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; } }));
  const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  window.frame = (t, yaw) => {
    const e = ease(Math.min(1, Math.max(0, t)));
    A.forEach(o => { if (o.userData.p0) o.position.lerpVectors(o.userData.p0, o.userData.p1, e); });
    const op = Math.max(0, 1 - e / 0.1);
    built.fade.forEach(g => { g.visible = op > 0.01; g.traverse(o => { if (o.isMesh) { o.material.opacity = op; o.castShadow = op > 0.5; } }); });
    pivot.rotation.y = yaw;
    ground.material.opacity = 0.22 * (1 - e);
    aim(camera, [-6 * e, 2 - 8 * e, -70], [-0.55, 0.32 + 0.12 * e, 0.77], 640 + 260 * e);
    if (params.has('oy')) camera.setViewOffset(W, H, 0, +params.get('oy'), W, H);
    renderer.render(scene, camera);
  };
  window.frame(0, 0);
}

renderer.render(scene, camera);
renderer.render(scene, camera);

// ---------- labels ----------
const title = document.getElementById('title');
const titles = {
  exploded: ['Aurora smart glasses: exploded view', 'Each part pulled out along the direction it is assembled'],
  assembled: ['Aurora smart glasses', 'Assembled: about 65–85 g, both arms carry electronics'],
  front: ['Aurora smart glasses', 'Front view: 12 MP camera and privacy LED on the wearer\'s right, tracking camera on the left'],
};
if (!CLEAN) {
title.innerHTML = `<h1>${titles[MODE][0]}</h1><p>${titles[MODE][1]}</p>`;
document.getElementById('foot').textContent = 'Concept render from the packaging plan in docs/glasses-packaging.md. Sizes are planning estimates.';
}

if (labels.length) {
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('width', W); svg.setAttribute('height', H);
  document.getElementById('wrap').appendChild(svg);
  scene.updateMatrixWorld(true);
  const pts = labels.map(l => {
    const v = l.local.clone(); l.obj.localToWorld(v); v.project(camera);
    return { ...l, sx: (v.x + 1) / 2 * W, sy: (1 - v.y) / 2 * H };
  });
  const cx = W / 2;
  const isL = p => p.pref ? p.pref === 'L' : p.sx < cx - 40;
  const sides = { L: pts.filter(isL), R: pts.filter(p => !isL(p)) };
  const ROW = 78, TOPY = 230, BOT = H - 110;
  function layout(list) {
    list.sort((a, b) => a.sy - b.sy);
    let y = TOPY;
    list.forEach(p => { p.ly = Math.max(p.sy, y); y = p.ly + ROW; });
    // push up if overflow
    let over = list.length ? list[list.length - 1].ly - BOT : 0;
    for (let i = list.length - 1; i >= 0 && over > 0; i--) {
      list[i].ly -= over;
      if (i > 0) { const gap = list[i].ly - list[i - 1].ly - ROW; over = gap < 0 ? -gap : 0; }
    }
  }
  layout(sides.L); layout(sides.R);
  // swap label slots to remove leader-line crossings
  function cross(a, b, c, d) {
    const o = (p, q, r) => Math.sign((q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x));
    return o(a, b, c) !== o(a, b, d) && o(c, d, a) !== o(c, d, b);
  }
  [['L', 80 + 400], ['R', W - 80 - 400]].forEach(([k, lx]) => {
    const list = sides[k];
    for (let it = 0; it < 200; it++) {
      let changed = false;
      for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const A = list[i], B = list[j];
        if (cross({ x: lx, y: A.ly }, { x: A.sx, y: A.sy }, { x: lx, y: B.ly }, { x: B.sx, y: B.sy })) {
          const t = A.ly; A.ly = B.ly; B.ly = t; changed = true;
        }
      }
      if (!changed) break;
    }
  });
  const LX0 = 80, RX0 = W - 80;
  let n = 0;
  const all = [...sides.L.map(p => ({ ...p, side: 'L' })), ...sides.R.map(p => ({ ...p, side: 'R' }))];
  all.forEach(p => {
    const lx = p.side === 'L' ? LX0 + 400 : RX0 - 400;
    const g = document.createElementNS(svgNS, 'g');
    const elbow = p.side === 'L' ? lx + 26 : lx - 26;
    const path = document.createElementNS(svgNS, 'polyline');
    path.setAttribute('points', `${lx},${p.ly} ${elbow},${p.ly} ${p.sx},${p.sy}`);
    path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#2d6cdf'); path.setAttribute('stroke-width', '2');
    g.appendChild(path);
    const dot = document.createElementNS(svgNS, 'circle');
    dot.setAttribute('cx', p.sx); dot.setAttribute('cy', p.sy); dot.setAttribute('r', 6);
    dot.setAttribute('fill', '#fff'); dot.setAttribute('stroke', '#2d6cdf'); dot.setAttribute('stroke-width', '3');
    g.appendChild(dot);
    const t1 = document.createElementNS(svgNS, 'text');
    const anchor = p.side === 'L' ? 'end' : 'start';
    const tx = p.side === 'L' ? lx - 10 : lx + 10;
    t1.setAttribute('x', tx); t1.setAttribute('y', p.ly - 4); t1.setAttribute('text-anchor', anchor);
    t1.setAttribute('font-size', '25'); t1.setAttribute('font-weight', '600'); t1.setAttribute('fill', '#15191e');
    t1.textContent = p.title; g.appendChild(t1);
    const t2 = document.createElementNS(svgNS, 'text');
    t2.setAttribute('x', tx); t2.setAttribute('y', p.ly + 24); t2.setAttribute('text-anchor', anchor);
    t2.setAttribute('font-size', '19'); t2.setAttribute('fill', '#5b6470');
    t2.textContent = p.sub; g.appendChild(t2);
    svg.appendChild(g);
    n++;
  });
}
window.RENDER_DONE = true;
