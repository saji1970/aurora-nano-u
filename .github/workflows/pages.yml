# Publishes the showcase site in site/ to GitHub Pages.
# Run it by hand from the Actions tab once Pages is set to "GitHub Actions"
# in Settings > Pages. Add a `push` trigger later if every merge should publish.
name: Deploy showcase site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
